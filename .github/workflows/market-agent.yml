name: Market Intelligence Agent & Pages Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Every day at 09:00 AM KST (00:00 UTC)
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Agent Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_LLM_RELEVANCE: "true"
        run: |
          python src/run_pipeline.py

      - name: Verify docs/index.html exists
        run: |
          test -f docs/index.html || (echo "docs/index.html not found!" && exit 1)
          test -f docs/report.json || (echo "docs/report.json not found!" && exit 1)
          echo "Dashboard files verified successfully."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
